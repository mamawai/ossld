<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ossld{% endblock %}</title>
<meta name="description" content="收录 LINUX DO 社区「开源推广」标签下的开源项目，每个项目都链接回原帖。">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#14161A"></rect><path d="M9 11l5 4-5 4M16 20h6" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span>ossld</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="/"{% if active == "home" %} aria-current="page"{% endif %}>发现</a>
    </nav>
    <a class="btn btn-outline" href="/submit">提交项目</a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>ossld · 收录 LINUX DO「开源推广」标签下的开源项目，数据来自原帖</span>
    <span>社区个人项目，非 LINUX DO 官方站点</span>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
